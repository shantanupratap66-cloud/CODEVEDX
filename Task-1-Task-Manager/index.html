<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Section with Theme Toggle -->
        <header class="header">
            <h1>📝 Task Manager</h1>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                🌙
            </button>
        </header>

        <!-- Input Section to Add New Tasks -->
        <div class="input-section">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..." 
                class="task-input"
                autocomplete="off"
            >
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>

        <!-- Filter Section -->
        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <!-- Task List Section -->
        <div class="tasks-container">
            <ul class="task-list" id="taskList">
                <!-- Tasks will be added here dynamically by JavaScript -->
            </ul>

            <!-- Empty State Message (shown when no tasks) -->
            <div class="empty-state" id="emptyState">
                <p class="empty-state-icon">📭</p>
                <p class="empty-state-text">No tasks yet. Add one to get started!</p>
            </div>
        </div>

        <!-- Task Counter -->
        <div class="task-stats">
            <span id="taskCount">0 tasks</span>
            <span id="completedCount">0 completed</span>
        </div>
    </div>

    <!-- Load JavaScript -->
    <script src="script.js"></script>
</body>
</html>
